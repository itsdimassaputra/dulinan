<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulinan — Kumpulan Game Gratis</title>
    <meta name="description" content="Mainkan game gratis langsung di browser. Tanpa download, tanpa registrasi.">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="apple-touch-icon" href="assets/img/logo.png">
    <script src="assets/js/theme-init.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="logo">
            <img src="assets/img/logo.png" alt="Dulinan" class="logo-img">
            <span>Dulinan</span>
        </a>

        <div class="header-actions">
            <button id="themeToggle" class="theme-btn" title="Ganti tema" aria-label="Ganti tema">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </div>
</header>

<main>
    <section class="hero">
        <div class="hero-animated-bg" aria-hidden="true">
            <span class="blob blob-1"></span>
            <span class="blob blob-2"></span>
            <span class="blob blob-3"></span>
            <span class="blob blob-4"></span>
        </div>

        <div class="hero-content container">
            <span class="hero-badge">
                <span class="dot"></span>
                <span id="gameCount">0</span> game siap dimainkan
            </span>
            <h1>Ayo Dulinan</h1>
            <p>Main Game Instan, Tanpa Hambatan.</p>
        </div>

        <div class="hero-fade" aria-hidden="true"></div>
    </section>

    <section class="container content-section">
        <div class="toolbar">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.3-4.3"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Cari game..." autocomplete="off">
            </div>
            <div class="filter-chips" id="filterChips">
                <!-- diisi oleh JS -->
            </div>
        </div>

        <div class="game-grid" id="gameGrid">
            <!-- diisi oleh JS -->
        </div>

        <div class="empty-state" id="emptyState" style="display:none;">
            <h3>Tidak ditemukan</h3>
            <p>Coba kata kunci atau kategori lain.</p>
        </div>
    </section>
</main>

<footer class="site-footer">
    <div class="container">
        © <span id="year"></span> Dulinan <br> Made with ❤️ by <a href=" https://github.com/itsdimassaputra" target="_blank" rel="noopener">Putra</a> · Supported by AI
    </div>
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script src="assets/js/home.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
